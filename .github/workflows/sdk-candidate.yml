name: SDK candidate

on:
  pull_request:
    paths:
      - 'candidate/**'
      - '.github/workflows/sdk-candidate.yml'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen SDK input
        run: echo '283b1079b67453be6e8f06ccd3bf9955fedd553a9ab881e3f1f3904467d87cca  candidate/contract/openapi.yaml' | sha256sum --check
      - name: Regenerate selected client
        run: |
          npm exec --yes --package=@hey-api/openapi-ts@0.99.0 \
            --package=typescript@5.9.3 -- \
            openapi-ts -i candidate/contract/openapi.yaml -o candidate/generated
          test -z "$(git status --porcelain -- candidate/generated)"
      - name: Compile candidate
        run: |
          npm exec --yes --package=typescript@5.9.3 -- \
            tsc --noEmit --skipLibCheck --target es2022 \
            --module nodenext --moduleResolution nodenext candidate/generated/index.ts
      - name: Build installable candidate tarball
        working-directory: candidate
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          mkdir -p "$RUNNER_TEMP/sdk-artifact"
          npm pack --pack-destination "$RUNNER_TEMP/sdk-artifact"
          mkdir -p "$RUNNER_TEMP/sdk-consumer"
          npm install --ignore-scripts --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/sdk-consumer" "$RUNNER_TEMP"/sdk-artifact/*.tgz
          SDK_CONSUMER="$RUNNER_TEMP/sdk-consumer" node -e \
            "const sdk = require(process.env.SDK_CONSUMER + '/node_modules/@nimble-way/nimble-js-candidate'); if (typeof sdk.listTasks !== 'function') process.exit(1)"
      - uses: actions/upload-artifact@v7
        with:
          name: typescript-sdk-candidate
          path: ${{ runner.temp }}/sdk-artifact/*.tgz
          if-no-files-found: error
