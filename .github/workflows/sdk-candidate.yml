name: SDK candidate

on:
  pull_request:
    paths:
      - 'candidate/**'
      - '.github/workflows/sdk-candidate.yml'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen SDK input
        run: echo '283b1079b67453be6e8f06ccd3bf9955fedd553a9ab881e3f1f3904467d87cca  candidate/contract/openapi.yaml' | sha256sum --check
      - name: Regenerate selected client
        working-directory: candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm exec -- openapi-ts -f openapi-ts.config.ts
          find generated -name '*.ts' -exec perl -pi -e 's/[ \t]+$//' {} +
          test -z "$(git status --porcelain -- generated)"
      - name: Compile candidate
        working-directory: candidate
        run: |
          npm run build
          npm run check:examples
      - name: Build installable candidate tarball
        working-directory: candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          mkdir -p "$RUNNER_TEMP/sdk-artifact"
          npm pack --pack-destination "$RUNNER_TEMP/sdk-artifact"
          mkdir -p "$RUNNER_TEMP/sdk-consumer"
          npm install --ignore-scripts --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/sdk-consumer" "$RUNNER_TEMP"/sdk-artifact/*.tgz
          SDK_CONSUMER="$RUNNER_TEMP/sdk-consumer" node <<'NODE'
          const sdk = require(process.env.SDK_CONSUMER + '/node_modules/@nimble-way/nimble-js-candidate');
          if (typeof sdk.Nimble !== 'function' || typeof sdk.createClient !== 'function') process.exit(1);
          let observed;
          const client = new sdk.Nimble({
            client: sdk.createClient({
              baseUrl: 'https://sdk.nimbleway.com',
              auth: 'example-token',
              fetch: async (input, init) => {
                const request = new Request(input, init);
                observed = {
                  method: request.method,
                  path: new URL(request.url).pathname,
                  authorization: request.headers.get('authorization'),
                };
                return new Response(JSON.stringify({ detail: 'Not found' }), {
                  status: 404,
                  headers: { 'content-type': 'application/json' },
                });
              },
            }),
          });
          client.tasks.get({
            task_id: '00000000-0000-4000-8000-000000000001',
          }).then((result) => {
            if (observed.method !== 'GET' ||
                observed.path !== '/v2/tasks/00000000-0000-4000-8000-000000000001' ||
                observed.authorization !== 'Bearer example-token' ||
                result.response.status !== 404) process.exit(1);
          }).catch(() => process.exit(1));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: typescript-sdk-candidate
          path: ${{ runner.temp }}/sdk-artifact/*.tgz
          if-no-files-found: error
